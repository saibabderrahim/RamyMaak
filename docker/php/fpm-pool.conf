[www]
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5
pm.max_requests = 500

; Vérification de santé du conteneur (cgi-fcgi).
ping.path = /fpm-ping
pm.status_path = /fpm-status

; Journaux de PHP sur la sortie du conteneur.
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
