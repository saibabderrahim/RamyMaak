# Frontal HTTPS de l'hôte (§14.3) : /etc/nginx/sites-available/ramymaak,
# lié dans sites-enabled. Certificat : certbot --nginx -d ramymaak.example.dz
# Remplacer ramymaak.example.dz par le domaine retenu (Q-15).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name ramymaak.example.dz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ramymaak.example.dz;

    ssl_certificate /etc/letsencrypt/live/ramymaak.example.dz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ramymaak.example.dz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # WebSocket (Reverb) : le chemin /app doit transmettre l'en-tête Upgrade.
    location /app {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Application, API, fichiers et photos.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 10m;
    }
}
