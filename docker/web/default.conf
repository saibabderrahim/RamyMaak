server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # API, cookie anti-CSRF, autorisation des canaux temps réel, santé.
    location ~ ^/(api|sanctum|broadcasting)(/|$) {
        include /etc/nginx/snippets/php.conf;
        include /etc/nginx/snippets/security-headers.conf;
        # Données métier : jamais conservées par le navigateur ni un proxy.
        fastcgi_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
    }

    location = /up {
        include /etc/nginx/snippets/php.conf;
        access_log off;
    }

    # Santé du conteneur web lui-même.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Service worker, page d'entrée et manifeste : jamais en cache, sinon les
    # mises à jour n'arrivent pas (§14.2).
    location ~ ^/(sw\.js|index\.html|manifest\.webmanifest)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fichiers versionnés par le build : cache d'un an.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Photos produits (§9.8), volume « storage » monté en lecture seule. Chaque
    # photo a sa propre adresse (identifiant du média) : une photo remplacée
    # change d'adresse, d'où le cache d'un an. « ^~ » : aucune location à
    # expression régulière ne reprend ces adresses. Barres obliques finales de
    # la location et de l'alias assorties (sinon /media../ remonterait d'un
    # dossier) ; pas de try_files, peu fiable avec alias : un fichier absent
    # répond 404, jamais la page de l'application.
    location ^~ /media/ {
        alias /srv/storage/public/media/;
        include /etc/nginx/snippets/security-headers.conf;
        # Sans « always » : une erreur (404) n'est pas mise en cache pour un an.
        add_header Cache-Control "public, max-age=31536000, immutable";
        # Seules des images ré-encodées sont stockées ici ; tout autre fichier
        # serait servi comme binaire à télécharger, jamais interprété.
        types {
            image/webp webp;
            image/jpeg jpg jpeg;
            image/png png;
        }
        default_type application/octet-stream;
        autoindex off;
        access_log off;
    }

    location /icons/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    # Application d'une seule page : toute autre adresse sert index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
