# Chaîne d'intégration (§14.4) : style, tests, audit des dépendances,
# construction des images et démarrage de la pile complète.
name: CI

on:
  push:
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: API Laravel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ramymaak_test
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot --silent"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, intl, zip, gd, bcmath, pcntl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('backend/composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Environnement de test
        run: cp .env.example .env

      - name: Style (Pint)
        run: vendor/bin/pint --test

      - name: Audit des dépendances
        run: composer audit

      - name: Tests (Pest, MySQL 8.4)
        run: vendor/bin/pest
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ramymaak_test
          DB_USERNAME: root
          DB_PASSWORD: root

  frontend:
    name: PWA React
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests (Vitest)
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit des dépendances
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: Images et démarrage de la pile
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Configuration de test
        run: |
          cp .env.example .env
          sed -i \
            -e "s|^APP_KEY=.*|APP_KEY=base64:$(openssl rand -base64 32)|" \
            -e "s|^APP_URL=.*|APP_URL=http://localhost:8090|" \
            -e "s|^DB_PASSWORD=.*|DB_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^MYSQL_ROOT_PASSWORD=.*|MYSQL_ROOT_PASSWORD=$(openssl rand -hex 16)|" \
            -e "s|^REVERB_APP_KEY=.*|REVERB_APP_KEY=$(openssl rand -hex 16)|" \
            -e "s|^REVERB_APP_SECRET=.*|REVERB_APP_SECRET=$(openssl rand -hex 16)|" \
            -e "s|^SANCTUM_STATEFUL_DOMAINS=.*|SANCTUM_STATEFUL_DOMAINS=localhost:8090|" \
            -e "s|^SESSION_SECURE_COOKIE=.*|SESSION_SECURE_COOKIE=false|" \
            .env

      - name: Construction des images
        run: docker compose build

      - name: Démarrage et migrations
        run: |
          docker compose up -d --wait mysql
          docker compose run --rm --no-deps app php artisan migrate --force
          docker compose run --rm --no-deps app php artisan db:seed --class='Database\Seeders\RolesAndPermissionsSeeder' --force
          docker compose up -d --wait

      - name: Vérifications de fumée
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8090/up > /dev/null
          curl -fsS http://127.0.0.1:8090/ | grep -q '<title>RamyMaak</title>'
          curl -fsS -I http://127.0.0.1:8090/sw.js | grep -qi 'cache-control: no-cache'
          status=$(curl -s -o /tmp/me.json -w '%{http_code}' -H 'Accept: application/json' http://127.0.0.1:8090/api/v1/auth/me)
          test "$status" = 401
          grep -q '"code":"UNAUTHENTICATED"' /tmp/me.json
          docker compose run --rm --no-deps app php artisan ramymaak:create-admin ci.admin

      - name: Journaux en cas d'échec
        if: failure()
        run: docker compose ps && docker compose logs --tail=100

      - name: Arrêt
        if: always()
        run: docker compose down -v
